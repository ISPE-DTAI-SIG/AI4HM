  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n<style>\n  :root{\n    --navy:#15294b;\n    --navy-2:#1f3a64;\n    --ink:#222530;\n    --muted:#646c7a;\n    --line:#e7e9ee;\n    --line-2:#d9dde4;\n    --bg:#ffffff;\n    --side:#f6f7f9;\n    --accent:#2c5aa0;\n    --accent-soft:#eef2f9;\n  }\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;scroll-padding-top:84px;}\n  body{margin:0;background:var(--bg);color:var(--ink);\n    font-family:\"IBM Plex Sans\",system-ui,sans-serif;font-size:16.5px;line-height:1.6;\n    -webkit-font-smoothing:antialiased;}\n  h1,h2,h3{font-family:\"Spectral\",Georgia,serif;color:var(--navy);}\n  a{color:var(--accent);}\n\n  /* hero band */\n  .hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding:clamp(46px,7vw,72px) 0 clamp(42px,6vw,64px);\n    background-image:radial-gradient(ellipse 52% 62% at 27% 54%, rgba(74,116,210,.30), transparent 62%),radial-gradient(circle at 88% 14%, rgba(63,103,168,.24),transparent 55%);}\n  .hero-in{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,40px);}\n  /* entrance — only armed once JS adds .fx-on, so content is visible by default */\n  @keyframes heroRise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}\n  .fx-on .hero-in>*{animation:heroRise .7s cubic-bezier(.22,.61,.36,1) both;}\n  .fx-on .hero-in>.eyebrow{animation-delay:.05s;}\n  .fx-on .hero-in>.hero-logo{animation-delay:.18s;}\n  .fx-on .hero-in>.hero-tag{animation-delay:.3s;}\n  .fx-on .hero-in>.full{animation-delay:.42s;}\n  .fx-on .hero-in>.cta{animation-delay:.54s;}\n  .fx-on .hero-in>.tags{animation-delay:.64s;}\n  @media(prefers-reduced-motion:reduce){.fx-on .hero-in>*{animation:none;}}\n  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#8fb0e6;font-weight:600;margin:0 0 20px;display:flex;align-items:center;gap:12px;}\n  .eyebrow .mk{width:18px;height:18px;background \n  .hero .tags b{color:#fff;font-weight:600;}\n\n  /* layout */\n  .layout{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,40px);display:grid;grid-template-columns:236px 1fr;gap:56px;align-items:start;}\n  .side{position:sticky;top:32px;padding:48px 0;}\n  .side .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 14px;font-family:\"IBM Plex Sans\",sans-serif;}\n  .side nav{display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line-2);}\n  .side nav a{color:var(--muted);text-decoration:none;font-size:14px;padding:8px 0 8px 16px;margin-left:-1px;border-left:2px solid transparent;transition:.14s;}\n  .side nav a:hover{color:var(--navy);border-left-color:var(--line-2);}\n  .side nav a.on{color:var(--navy);font-weight:600;border-left-color:var(--accent);}\n  .side .dlbox{margin-top:26px;background:var(--accent-soft);border:1px solid #dce6f5;border-radius:10px;padding:16px;}\n  .side .dlbox p{margin:0 0 10px;font-size:12.5px;color:var(--navy);}\n  .side .dlbox a{display:block;text-align:center;background:var(--navy);color:#fff;text-decoration:none;font-size:13px;font-weight:500;padding:10px;border-radius:7px;}\n  .side .dlbox a:hover{background:var(--navy-2);}\n\n  main{padding:48px 0 24px;min-width:0;}\n  .blk{padding-bottom:52px;margin-bottom:52px;border-bottom:1px solid var(--line);}\n  .blk:last-child{border-bottom:none;}\n  h2{font-size:clamp(23px,4.6vw,30px);font-weight:600;margin:0 0 20px;letter-spacing:-.01em;}\n  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px;font-family:\"IBM Plex Sans\",sans-serif;}\n  p{margin:0 0 16px;}\n  p.lead{font-size:18px;color:var(--ink);}\n  .blk p{color:#3d4350;}\n  b{color:var(--ink);}\n\n  .principles{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;}\n  .principles span{font-size:12.5px;color:var(--navy);background:var(--side);border:1px solid var(--line);padding:6px 13p :none;font-size:15px;padding:11px 12px;border-radius:8px;}\n  .mbar .sheet a:hover,.mbar .sheet a:active{background:var(--accent-soft);color:var(--navy);}\n  .mbar .sheet .dl{margin-top:6px;background:var(--navy);color:#fff;text-align:center;font-weight:600;}\n\n  @media(max-width:980px){\n    .mbar{display:flex;}\n    .layout{grid-template-columns:1fr;gap:0;}\n    .side{display:none;}\n    .aud{grid-template-columns:1fr 1fr;}\n    main{padding:36px 0 16px;}\n  }\n  @media(max-width:620px){\n    .hero .tags{gap:14px 18px;margin-top:26px;}\n    .cta{gap:10px;}\n    .cta .btn{flex:1 1 auto;justify-content:center;}\n    .aud{grid-template-columns:1fr;}\n    .authors{grid-template-columns:1fr 1fr;}\n    .blk{padding-bottom:40px;margin-bottom:40px;}\n    details.item .body{padding:0 16px 16px 16px;}\n    details.item summary{padding:14px 14px;}\n    .dl{padding:24px;}\n    .dl .btn.primary{width:100%;justify-content:center;}\n    .contact-box{padding:26px 20px;}\n    .cite{padding:46px 18px 20px;}\n    .copy{top:14px;right:14px;}\n  }\n  @media(max-width:400px){\n    .authors{grid-template-columns:1fr;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- MOBILE TOP BAR -->\n<div class=\"mbar\">\n  <img src=\"e6c32caf-7f69-447b-9404-d21321c328be\" alt=\"AI4HM\">\n  <details id=\"mnav\">\n    <summary>Contents <span class=\"car\">▾<\u002Fspan><\u002Fsummary>\n    <div class=\"sheet\">\n      <a href=\"#about\">What it is<\u002Fa>\n      <a href=\"#audience\">Who it's for<\u002Fa>\n      <a href=\"#contents\">Template contents<\u002Fa>\n      <a href=\"#download\">Download<\u002Fa>\n      <a href=\"#cite\">How to cite<\u002Fa>\n      <a href=\"#authors\">Authors<\u002Fa>\n      <a href=\"#versions\">Version history<\u002Fa>\n      <a href=\"#feedback\">Feedback<\u002Fa>\n      <a class=\"dl\" href=\"assets/AI4HM-Protocol-Template-v0.2.docx\" download=\"\">↓ Download .docx<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdetails>\n<\u002Fdiv>\n\n<!-- HERO -->\n<header class=\"hero\">\n  <div class=\"globe3d\" aria-hidden=\"true\">\n    <div class=\"core\"><\u002Fdiv>\n    <canvas class=\"node-canvas\"><\u002Fcanvas>\n  <\u002Fdiv>\n  <div class=\"hero-in\">\n    <div class=\"hero-logo\">\n      <div class=\"lockup\">\n        <img class=\"mark-word\" src=\"e6c32caf-7f69-447b-9404-d21321c328be\" alt=\"AI4HM\">\n      <\u002Fdiv>\n      <img class=\"mark-tag\" src=\"b88684f3-3525-4f22-a148-15662f7f92f5\" alt=\"Artificial Intelligence for Health and Medicine\">\n    <\u002Fdiv>\n    <p class=\"full\">A protocol template for observational studies that develop, validate, or evaluate AI/ML-based models, algorithms, and tools in health and medicine.<\u002Fp>\n    <div class=\"cta\">\n      <a class=\"btn primary\" href=\"#contents\" style=\"font-size: 16px\">Read the template<\u002Fa>\n      <a class=\"btn ghost\" href=\"assets/AI4HM-Protocol-Template-v0.2.docx\" download=\"\" style=\"font-size: 16px\">↓ Download .docx<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"tags\"><span style=\"font-size: 16px\">Version <b>0.2<\u002Fb><\u002Fspan><span>\n<\u002Fspan><span style=\"font-size: 16px\">License:&nbsp;Freely available<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"layout\">\n  <!-- SIDEBAR -->\n  <aside class=\"side\">\n    <p class=\"lbl\" style=\"font-size: 14px\">On this page<\u002Fp>\n    <nav id=\"sidenav\">\n      <a href=\"#about\" style=\"font-size: 20px\">What it is<\u002Fa>\n      <a href=\"#audience\" style=\"font-size: 20px\">Who it's for<\u002Fa>\n      <a href=\"#contents\" style=\"font-size: 20px\">Template contents<\u002Fa>\n      <a href=\"#download\" style=\"font-size: 20px\">Download<\u002Fa>\n      <a href=\"#cite\" style=\"font-size: 20px\">How to cite<\u002Fa>\n      <a href=\"#authors\" style=\"font-size: 20px\">Authors<\u002Fa>\n      <a href=\"#versions\" style=\"font-size: 20px\">Version history<\u002Fa>\n      <a href=\"#feedback\" style=\"font-size: 20px\">Feedback<\u002Fa>\n    <\u002Fnav>\n    <div class=\"dlbox\">\n      <p><b style=\"font-size: 15px\">AI4HM template<\u002Fb><br>Word (.docx) · v0.2<\u002Fp>\n      <a href=\"assets/AI4HM-Protocol-Template-v0.2.docx\" download=\"\" style=\"font-size: 14px\">↓ Download<\u002Fa>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- MAIN -->\n  <main>\n    <section class=\"blk\" id=\"about\">\n      <p class=\"kicker\" style=\"font-size: 20px\">What it is<\u002Fp>\n      <h2>Structure where you need it, flexibility where the science demands it.<\u002Fh2>\n      <p class=\"lead\" style=\"font-size: 24px\">Protocols are living documents that describe the intended conduct of a study. Having a pre-specified protocol is scientific best practice, and is commonly expected by data stewards, ethics boards, journals, and other research stakeholders.<\u002Fp>\n      <p style=\"font-size: 24px\">Existing templates — such as the EU PAS Register template and <b>HARPER<\u002Fb> — were built for real-world evidence studies with pre-specified analyses and well-defined components. They do not fully address the iterative development, validation, and deployment considerations unique to AI/ML research.<\u002Fp>\n      <p style=\"font-size: 24px\"><b>AI4HM<\u002Fb> is a fit-for-purpose template that provides structure while preserving methodological flexibility — accommodating iterative model development, feature engineering as part of the research process, multiple validation stages, performance metrics beyond traditional epidemiology, and fairness, bias, and interpretability considerations.<\u002Fp>\n      <div class=\"principles\"><span style=\"font-size: 14px\">Modular<\u002Fspan><span style=\"font-size: 14px\">Flexible with rigor<\u002Fspan><span style=\"font-size: 14px\">Downstream-compatible<\u002Fspan><span style=\"font-size: 14px\">Accessible<\u002Fspan><span style=\"font-size: 14px\">Living document<\u002Fspan><\u002Fdiv>\n      <div class=\"callout\"><b>Scope note.<\u002Fb> This template is not designed for studies that support regulatory submissions or that are considered Software as a Medical Device (SaMD). Support for regulatory submissions is planned for future versions.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"blk\" id=\"audience\">\n      <p class=\"kicker\" style=\"font-size: 20px\">Who it's for<\u002Fp>\n      <h2>Built for everyone at the table.<\u002Fh2>\n      <div class=\"aud\">\n        <div class=\"c\"><h3 style=\"font-size: 20px\">Researchers<\u002Fh3><p style=\"font-size: 18px\">Design and document AI/ML studies with a defensible, reproducible structure from the outset.<\u002Fp><\u002Fdiv>\n        <div class=\"c\"><h3 style=\"font-size: 20px\">Sponsors<\u002Fh3><p>Standardize how AI/ML projects are scoped, planned, and governed across teams.<\u002Fp><\u002Fdiv>\n        <div class=\"c\"><h3 style=\"font-size: 20px\">Regulators &amp; reviewers<\u002Fh3><p>Assess study design, validity, and limitations against a consistent framework.<\u002Fp><\u002Fdiv>\n        <div class=\"c\"><h3>Ethics boards<\u002Fh3><p>Evaluate human-subjects protection, consent, and intended use with clarity.<\u002Fp><\u002Fdiv>\n        <div class=\"c\"><h3>Data custodians<\u002Fh3><p>Understand data provenance, transformation, and management before granting access.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"blk\" id=\"contents\">\n      <p class=\"kicker\" style=\"font-size: 20px\">The template, section by section<\u002Fp>\n      <h2>Sixteen core sections.<\u002Fh2>\n      <p class=\"toc-note\">Expand any section to see what it covers. Headings marked <b>Optional<\u002Fb> can be removed when not relevant to a study.<\u002Fp>\n\n      <details class=\"item\"><summary><span class=\"num\">1<\u002Fspan><span class=\"ttl\">Title Page<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Protocol version and date, AI/ML tool name, investigators, sponsor, registration, and conflict-of-interest declaration.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">2<\u002Fspan><span class=\"ttl\">Abstract<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">A structured summary covering background, objectives, data sources, study design for training, outcome label, model training approach, study design for evaluation, and evaluation metrics.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">3<\u002Fspan><span class=\"ttl\">Amendments &amp; Updates<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Living-document tracking: version, date, sections updated, and a description and rationale for each change.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">4<\u002Fspan><span class=\"ttl\">List of Abbreviations<\u002Fspan><span class=\"opt\">Optional<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">A reference list of abbreviations used throughout the protocol.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">5<\u002Fspan><span class=\"ttl\">Milestones<\u002Fspan><span class=\"opt\">Optional<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Key project milestones and timelines, where useful to the audience.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">6<\u002Fspan><span class=\"ttl\">Background &amp; Rationale<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">The problem or unmet need the AI/ML tool addresses, existing tools and approaches, current gaps and limitations, and how this research addresses them.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">7<\u002Fspan><span class=\"ttl\">Study Scope &amp; Intended Use<\u002Fspan><span class=\"opt\">Optional<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Intended-use context, setting restrictions, and out-of-scope areas for the tool.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">8<\u002Fspan><span class=\"ttl\">Study Objectives<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Primary, secondary, and exploratory objectives — presented in a structured table linking each <b>Objective<\u002Fb> to its <b>Population(s)<\u002Fb> and <b>Metric(s)<\u002Fb>.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">9<\u002Fspan><span class=\"ttl\">Research Methods<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">The methodological core of the protocol, organized into modular sub-sections included as relevant:\n        <ul>\n          <li><b>Existing Data Sources<\u002Fb> — registries, EHR, claims, prior study data; validity, accuracy, provenance.<\u002Fli>\n          <li><b>Original Data Collection<\u002Fb> — new data from participants or human raters; ethics, consent, rater qualifications.<\u002Fli>\n          <li><b>Data Cleaning &amp; Transformation<\u002Fb> — preparation, common data models (OMOP, FHIR), quality procedures, linkage.<\u002Fli>\n          <li><b>Model Development — Study Design &amp; Setting<\u002Fb> — design classification, target vs. training population, selection criteria, time periods, design diagram.<\u002Fli>\n          <li><b>Model Development — Training Task &amp; Outcome Label<\u002Fb> — task setup, label definition, rater credentials and annotation, label validation.<\u002Fli>\n          <li><b>Model Development — Features<\u002Fb> — high-level feature types; an exhaustive list is not required, recognizing selection as iterative.<\u002Fli>\n          <li><b>Model Development — Training &amp; Fine-tuning<\u002Fb> — iterative development, architectures, ensembling, cross-validation, software.<\u002Fli>\n          <li><b>Evaluation — Study Design &amp; Setting<\u002Fb> — design and rationale, comparators, evaluation populations and subgroups, external validity.<\u002Fli>\n          <li><b>Evaluation — Metrics<\u002Fb> — performance metrics matched to objectives, with rationale and references.<\u002Fli>\n          <li><b>Evaluation — Analyses<\u002Fb> — descriptive analyses, statistical tests, confidence intervals, fairness and bias analyses, software.<\u002Fli>\n          <li><b>Sample Size Calculations<\u002Fb> — power and sample size with assumptions and justifications.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">10<\u002Fspan><span class=\"ttl\">Data Management<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Data transfer, storage, backup, and security, alongside model version control.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">11<\u002Fspan><span class=\"ttl\">Limitations<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Data source, study design, model development, and analytic-method limitations, with mitigation steps.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">12<\u002Fspan><span class=\"ttl\">Protection of Human Subjects<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Legal compliance, data privacy, and ethics review, including exemption status where applicable.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">13<\u002Fspan><span class=\"ttl\">Adverse Events<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">For patient-facing tools: adverse-event collection, management, and reporting, with regulatory requirements noted.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">14<\u002Fspan><span class=\"ttl\">Plans for Communicating Results<\u002Fspan><span class=\"opt\">Optional<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">How and where results will be disseminated.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">15<\u002Fspan><span class=\"ttl\">References<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Cited literature and guidance documents.<\u002Fdiv><\u002Fdetails>\n      <details class=\"item\"><summary><span class=\"num\">16<\u002Fspan><span class=\"ttl\">Appendices<\u002Fspan><span class=\"chev\">›<\u002Fspan><\u002Fsummary><div class=\"body\">Code lists, algorithms, and detailed methods, with a structured index table.<\u002Fdiv><\u002Fdetails>\n    <\u002Fsection>\n\n    <section class=\"blk\" id=\"download\">\n      <div class=\"dl\">\n        <div class=\"l\"><h3>Get the AI4HM template<\u002Fh3><p style=\"font-size: 16px\">Microsoft Word (.docx) · Version 0.2 · For feedback · Freely available<\u002Fp><\u002Fdiv>\n        <a class=\"btn primary\" href=\"assets/AI4HM-Protocol-Template-v0.2.docx\" download=\"\">↓ Download template<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"callout\" style=\"margin-top:18px;\">NOTE: Guidance to authors appears in blue italic text and should be removed from the finalized protocol. A glossary of terms is included and may be adapted as an appendix.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"blk\" id=\"cite\">\n      <p class=\"kicker\" style=\"font-size: 20px\">How to cite<\u002Fp>\n      <h2>Citing AI4HM<\u002Fh2>\n      <div class=\"cite\">\n        <button class=\"copy\" onclick=\"copyCite(this)\">Copy<\u002Fbutton>\n        <div class=\"tag\">Manuscript in preparation<\u002Fdiv>\n        <span id=\"citetext\">Rough K, Diaz-Decaro J, Dickinson H, Divan HA, Naidoo N, Shiwa V, Smith M, Stettenbauer E, Teltsch D, Welby S. AI4HM: A Protocol Template for Observational Studies Involving Artificial Intelligence and Machine Learning in Health and Medicine. 2026. Manuscript in preparation.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"blk\" id=\"authors\">\n      <p class=\"kicker\" style=\"font-size: 20px\">Authors &amp; acknowledgements<\u002Fp>\n      <h2>Created by<\u002Fh2>\n      <div class=\"authors\">\n        <div>Kathryn Rough<\u002Fdiv><div>John Diaz-Decaro<\u002Fdiv><div>Harriet Dickinson<\u002Fdiv>\n        <div>Hozefa A. Divan<\u002Fdiv><div>Nivantha Naidoo<\u002Fdiv><div>Veronique Shiwa<\u002Fdiv>\n        <div>Meredith Smith<\u002Fdiv><div>Elizabeth Stettenbauer<\u002Fdiv><div>Dana Teltsch<\u002Fdiv>\n        <div>Sarah Welby<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ack\" style=\"font-size: 16px\">This template was created and revised based on the collective experience of the authors in designing and evaluating AI/ML-based tools for healthcare and medicine.<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"blk\" id=\"versions\">\n      <p class=\"kicker\" style=\"font-size: 20px\">Version history<\u002Fp>\n      <h2>A living document<\u002Fh2>\n      <div class=\"ver\">\n        <div class=\"v\"><span class=\"vn\">v0.2<\u002Fspan><span class=\"vd\">Released for community feedback.<\u002Fspan><span class=\"badge cur\">Current<\u002Fspan><\u002Fdiv>\n        <div class=\"v\"><span class=\"vn\">v0.1<\u002Fspan><span class=\"vd\">Initial internal draft.<\u002Fspan><span class=\"badge old\">Archived<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ver-note\">New versions and the rationale for each change will be recorded here as the template evolves alongside AI/ML in healthcare and medicine.<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"blk\" id=\"feedback\" style=\"border-bottom:none;\">\n      <p class=\"kicker\" style=\"font-size: 15px\">Feedback &amp; contact<\u002Fp>\n      <div class=\"contact-box\">\n        <p>Feedback and ideas for improvement are appreciated and shape future versions of the template.<\u002Fp>\n        <a class=\"mail\" href=\"mailto:info@kathrynrough.net\">info@kathrynrough.net<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<footer>\n  <div class=\"layout\"><span>AI4HM · Protocol Template<\u002Fspan><span>Freely available · © 2026 the authors<\u002Fspan><\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // standalone build: point all .docx links at the embedded blob so download works offline\n  (function(){\n    const r=window.__resources&&window.__resources.docx;\n    if(!r) return;\n    document.querySelectorAll('a[href$=\".docx\"]').forEach(a=>{\n      a.setAttribute('href',r);\n      a.setAttribute('download','AI4HM-Protocol-Template-v0.2.docx');\n    });\n  })();\n  function copyCite(btn){\n    const t=document.getElementById('citetext').innerText;\n    navigator.clipboard.writeText(t).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1600);});\n  }\n  // scrollspy\n  const links=[...document.querySelectorAll('#sidenav a')];\n  const secs=links.map(a=>document.querySelector(a.getAttribute('href')));\n  const obs=new IntersectionObserver(es=>{\n    es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.remove('on'));\n      const i=secs.indexOf(e.target);if(i>=0)links[i].classList.add('on');}});\n  },{rootMargin:'-20% 0px -70% 0px'});\n  secs.forEach(s=>s&&obs.observe(s));\n\n  // close the mobile contents sheet after picking a destination\n  (function(){\n    const mn=document.getElementById('mnav');\n    if(!mn) return;\n    mn.querySelectorAll('.sheet a').forEach(a=>{\n      a.addEventListener('click',()=>mn.removeAttribute('open'));\n    });\n    document.addEventListener('click',e=>{\n      if(mn.hasAttribute('open')&&!mn.contains(e.target)) mn.removeAttribute('open');\n    });\n  })();\n\n  // hero entrance reveal — armed only when motion is welcome; a failsafe clears it\n  // so content can never stay stuck in the hidden from-state (export, frozen tab…)\n  (function(){\n    if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;\n    docu
